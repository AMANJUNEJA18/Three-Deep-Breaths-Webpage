<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f1e7">
<meta name="description" content="Three Deep Breaths.">
<meta property="og:title" content="Three Deep Breaths.">
<meta property="og:description" content="Three Deep Breaths.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://threedeepbreaths.in/">
<title>Three Deep Breaths.</title>
<style>
:root{--paper:#f6f1e7;--ink:#253128;--green:#294632}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink)}
body{font-family:Georgia,"Times New Roman",serif;-webkit-font-smoothing:antialiased}
main{min-height:100svh;display:flex;flex-direction:column;padding:max(30px,env(safe-area-inset-top)) max(28px,5vw) max(30px,env(safe-area-inset-bottom))}
header{font-size:20px}
.hero{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 0 80px}
h1{margin:0;font-size:clamp(48px,9vw,82px);line-height:1;font-weight:400;letter-spacing:-.045em}
.begin{margin-top:48px;display:inline-flex;align-items:center;justify-content:center;min-width:150px;min-height:52px;padding:0 28px;border-radius:999px;background:var(--green);color:#fffdf8;text-decoration:none;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:15px}
.begin:active{opacity:.88}
.choice{transition:background .2s ease,color .2s ease,border-color .2s ease}
.choice.primary{background:var(--green);color:#fffdf8;border:1px solid var(--green)}
.choice.secondary{background:rgba(255,255,255,.12);color:var(--green);border:1px solid #c4c5b9}
.choice.secondary:hover{background:var(--green);color:#fffdf8;border-color:var(--green)}
.hero:has(.secondary:hover) .primary{background:rgba(255,255,255,.12);color:var(--green);border-color:#c4c5b9}
.hero:has(.primary:hover) .secondary{background:rgba(255,255,255,.12);color:var(--green);border-color:#c4c5b9}
.night-subtle{margin:10px 0 0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:12px;color:#8a9088;letter-spacing:.025em}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<main>
<header>Three Deep Breaths.</header>
<section class="hero">
<h1>Three Deep Breaths.</h1>
<a class="begin choice primary" href="https://app.threedeepbreaths.in/" aria-label="Breathe">Breathe</a>
<p class="night-subtle breathe-subtle">A quiet pause, whenever you need it.</p>
<a class="begin choice secondary night-link" href="https://app.threedeepbreaths.in/?night=1" aria-label="Night">Night</a>
<p class="night-subtle">A quiet retreat into the night.</p>
</section>
</main>

<script>
/*
  The homepage is intentionally a simple static page.
  If an older version of our homepage service worker is already installed,
  unregister it once so it cannot keep serving stale HTML.
*/
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.getRegistrations()
    .then(registrations => {
      registrations.forEach(registration => registration.unregister());
    })
    .catch(() => {});
}
</script>
</body>
</html>
